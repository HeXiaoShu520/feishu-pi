name: TypeScript

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-stickers.txt
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run doctor -- --no-config
      - run: python test/sticker-frames.test.py
