name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  minipet:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/minipet/requirements.txt
      - run: pip install -r requirements.txt pyflakes
        working-directory: apps/minipet
      - run: python -m pyflakes src
        working-directory: apps/minipet
      - run: python -m pytest -q
        working-directory: apps/minipet
