# CI：每次 push / PR 自动运行静态检查与全量测试
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      # Qt 测试无需真实显示器，offscreen 平台可稳定运行
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt pyflakes

      - name: 静态检查（未使用导入/变量）
        run: python -m pyflakes src

      - name: 全量测试
        run: python -m pytest -q
