
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feishu-Pi 配置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-bottom: 10px; color: #333; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .section { margin-bottom: 30px; }
    .section-title { font-size: 18px; font-weight: 600; color: #333; margin-bottom: 15px; border-bottom: 2px solid #4CAF50; padding-bottom: 5px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; color: #555; font-size: 14px; font-weight: 500; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #4CAF50; }
    .btn { padding: 12px 24px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; font-weight: 500; }
    .btn-primary { background: #4CAF50; color: white; }
    .btn-primary:hover { background: #45a049; }
    .btn-secondary { background: #666; color: white; margin-left: 10px; }
    .btn-secondary:hover { background: #555; }
    .actions { margin-top: 30px; text-align: right; }
    .message { padding: 12px; border-radius: 4px; margin-bottom: 20px; }
    .message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .hint { font-size: 12px; color: #888; margin-top: 3px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Feishu-Pi 配置</h1>
    <p class="subtitle">配置飞书应用和 AI 模型参数</p>

    <div id="message"></div>

    <form id="configForm">
      <!-- 飞书配置 -->
      <div class="section">
        <div class="section-title">飞书应用配置</div>
        <div class="form-group">
          <label for="FEISHU_APP_ID">App ID *</label>
          <input type="text" id="FEISHU_APP_ID" name="FEISHU_APP_ID" required>
        </div>
        <div class="form-group">
          <label for="FEISHU_APP_SECRET">App Secret *</label>
          <div style="position: relative;">
            <input type="password" id="FEISHU_APP_SECRET" name="FEISHU_APP_SECRET" required>
            <button type="button" onclick="togglePassword('FEISHU_APP_SECRET')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px;">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label for="FEISHU_ADMIN">管理员标识 *</label>
          <input type="text" id="FEISHU_ADMIN" name="FEISHU_ADMIN" required placeholder="支持 Open ID / 姓名 / 邮箱">
          <div class="hint">机器人管理员，支持 Open ID、中文名、英文名或邮箱</div>
        </div>
      </div>

      <!-- 模型配置 -->
      <div class="section">
        <div class="section-title">AI 模型配置</div>
        <div class="form-group">
          <label for="FEISHU_PI_MODEL_PROVIDER">模型提供商</label>
          <select id="FEISHU_PI_MODEL_PROVIDER" name="FEISHU_PI_MODEL_PROVIDER">
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai">OpenAI (GPT)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="FEISHU_PI_MODEL_NAME">模型名称</label>
          <input type="text" id="FEISHU_PI_MODEL_NAME" name="FEISHU_PI_MODEL_NAME" placeholder="claude-sonnet-4-6">
        </div>
        <div class="form-group">
          <label for="FEISHU_PI_MODEL_BASE_URL">Base URL *</label>
          <input type="text" id="FEISHU_PI_MODEL_BASE_URL" name="FEISHU_PI_MODEL_BASE_URL" placeholder="https://api.anthropic.com" required>
        </div>
        <div class="form-group">
          <label for="FEISHU_SHOW_MODEL_STATS">回复末尾显示模型统计</label>
          <select id="FEISHU_SHOW_MODEL_STATS" name="FEISHU_SHOW_MODEL_STATS">
            <option value="1">开启（模型 · token · 费用 · 耗时）</option>
            <option value="0">关闭</option>
          </select>
          <div class="hint">关闭后回复末尾不再显示统计小字；调用工具的过程状态不受影响</div>
        </div>
      </div>

      <!-- API Key -->
      <div class="section">
        <div class="section-title">API Key</div>
        <div class="form-group">
          <label for="FEISHU_PI_MODEL_API_KEY">API Key *</label>
          <div style="position: relative;">
            <input type="password" id="FEISHU_PI_MODEL_API_KEY" name="FEISHU_PI_MODEL_API_KEY" placeholder="sk-ant-... 或 sk-proj-..." required>
            <button type="button" onclick="togglePassword('FEISHU_PI_MODEL_API_KEY')" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px;">👁️</button>
          </div>
          <div class="hint">根据所选模型提供商填写对应的 API Key</div>
        </div>
      </div>

      <!-- 系统提示词 -->
      <div class="section">
        <div class="section-title">系统提示词（可选）</div>
        <div class="form-group">
          <label for="FEISHU_PI_SYSTEM_PROMPT">系统提示词</label>
          <textarea id="FEISHU_PI_SYSTEM_PROMPT" name="FEISHU_PI_SYSTEM_PROMPT" rows="4" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: inherit; resize: vertical;" placeholder="例如：你是一个专业的编程助手，擅长代码分析和问题解决。"></textarea>
          <div class="hint">自定义 AI 助手的身份和行为特征</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-secondary" onclick="location.reload()">重置</button>
        <button type="submit" class="btn btn-primary">保存配置</button>
      </div>
    </form>
  </div>

  <script>

    // 切换密码显示
    function togglePassword(fieldId) {
      const input = document.getElementById(fieldId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // 加载配置
    async function loadConfig() {
      const res = await fetch('/api/config');
      const config = await res.json();
      for (const [key, value] of Object.entries(config)) {
        const input = document.getElementById(key);
        if (input && input.type !== 'hidden') input.value = value || '';
      }
      // 开关下拉框：把 1/true/on 等写法归一成选项值 1/0，未配置视为开启
      const statsToggle = document.getElementById('FEISHU_SHOW_MODEL_STATS');
      if (statsToggle) {
        const raw = (config.FEISHU_SHOW_MODEL_STATS ?? '1').toString().trim().toLowerCase();
        statsToggle.value = ['1', 'true', 'on', 'yes'].includes(raw) ? '1' : '0';
      }
    }

    // 保存配置
    document.getElementById('configForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const config = {};
      for (const [key, value] of formData.entries()) {
        config[key] = value;
      }

      try {
        const res = await fetch('/api/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(config)
        });

        if (res.ok) {
          showMessage('配置保存成功！重启服务后生效。', 'success');
        } else {
          const error = await res.text();
          showMessage('保存失败：' + error, 'error');
        }
      } catch (err) {
        showMessage('保存失败：' + err.message, 'error');
      }
    });

    // 显示消息
    function showMessage(text, type) {
      const div = document.getElementById('message');
      div.className = 'message ' + type;
      div.textContent = text;
      setTimeout(() => { div.className = ''; div.textContent = ''; }, 5000);
    }

    loadConfig();
  </script>
</body>
</html>
